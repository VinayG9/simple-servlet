name: Compile and Deploy to Local Tomcat

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: simple-servlet   # 👈 all steps run here

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Build Web Application Archive (WAR)
      run: mvn clean package

    - name: List target directory
      run: dir target

    - name: Deploy to Local Tomcat Webapps
      shell: pwsh
      run: |
        $war = Get-ChildItem -Path "target" -Filter *.war | Select-Object -First 1
        Copy-Item $war.FullName -Destination "C:\Users\hp\Downloads\apache-tomcat-10.1.57\webapps" -Force

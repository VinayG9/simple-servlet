apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: servlet-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: my-servlet.local             # <-- The custom domain name you want to use
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: servlet-service      # <-- Matches your Service name exactly
            port:
              number: 8080             # <-- Matches your Service port

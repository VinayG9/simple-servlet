apiVersion: apps/v1
kind: Deployment
metadata:
  name: servlet-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-servlet
  template:
    metadata:
      labels:
        app: simple-servlet
    spec:
      containers:
      - name: servlet-container
        image: local/final-tomcat:v1  # <-- Updated unique tag
        imagePullPolicy: Never                  # <-- Forces local cluster lookup
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: servlet-service
spec:
  type: LoadBalancer
  selector:
    app: simple-servlet
  ports:
  - port: 8080
    targetPort: 8080
